name: userland

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/userland.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: termux
        run: python3 tools/termux.py

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: userland
          name: userland
          body: termux userland the app unpacks on first run
          files: out/termux.tar.gz
          overwrite_files: true
