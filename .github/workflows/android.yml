name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: build
        run: gradle :app:assembleRelease :app:assembleDebug --no-daemon

      - name: rename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/botfarm.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/botfarm-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: botfarm-apk
          path: dist/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: apk
          body: latest build from main, install botfarm.apk
          files: dist/*.apk
          overwrite_files: true
